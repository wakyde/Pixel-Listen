name: shell
description: "Personal Integration Platform - Shell"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  shared_ui:
    path: ../shared/shared_ui
  shared_auth:
    path: ../shared/shared_auth
  shared_db:
    path: ../shared/shared_db
  english_listening:
    path: ../plugins/english_listening
  flashcards:
    path: ../plugins/flashcards
  english_songs:
    path: ../plugins/english_songs
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true