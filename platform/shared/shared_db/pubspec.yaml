name: shared_db
description: "Unified data layer for platform plugins"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.23.1
  sqlite3: ^2.7.6
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_ui:
    path: ../shared_ui
  shared_auth:
    path: ../shared_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.14